name: Verificar Angular
on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps
      - name: Compilar Angular
        run: npm run build
      - name: Pruebas unitarias
        run: npm test
